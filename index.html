<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Yuan LP 改善案（スマホ版）</title>
<script>
  // スマホで開いたときは枠なしで本体を直接表示する
  if (window.innerWidth < 700) { location.replace('lp.html' + location.search + location.hash); }
</script>
<style>
  :root{color-scheme:light}
  html,body{height:100%}
  body{margin:0;background:#e4e2db;font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;color:#484848;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}
  .wrap{display:grid;gap:12px;justify-items:center}
  .note{font-size:13px;line-height:1.6;text-align:center;margin:0}
  .note a{color:#0b5c64}
  .phone{width:390px;max-width:100%;height:min(844px,calc(100vh - 110px));background:#111;border-radius:40px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);box-sizing:content-box}
  .phone iframe{display:block;width:100%;height:100%;border:0;border-radius:30px;background:#FBFBF6}
</style>
</head>
<body>
  <div class="wrap">
    <p class="note">Yuan LP 改善案（スマホ版）。スマホで開くと、そのまま全画面で表示されます。</p>
    <div class="phone"><iframe src="lp.html" title="Yuan LP 改善案"></iframe></div>
    <p class="note"><a href="lp.html">PC の幅でそのまま開く</a>（PC 版は今回の提案に含めていません）</p>
  </div>
</body>
</html>
